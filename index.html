<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>伴读 Reader</title>
  <meta name="theme-color" content="#0b7a75">
  <meta name="description" content="一个面向长文、学习材料和严肃内容的低阻力阅读辅助工具。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --panel: #fffefa;
      --ink: #171717;
      --muted: #68635b;
      --line: #d9d1c3;
      --hairline: rgba(23, 23, 23, 0.1);
      --panel-shadow: 0 18px 46px rgba(45, 39, 28, 0.06);
      --control-bg: rgba(255, 255, 255, 0.72);
      --accent: #0b7a75;
      --accent-ink: #ffffff;
      --highlight: #dfc6cd;
      --highlight-ink: #101010;
      --mark: #0f766e;
      --mark-bg: rgba(15, 118, 110, 0.1);
      --flow-link: #1d70b8;
      --flow-old: #fff0a6;
      --flow-new: #147a4b;
      --flow-tag: #f3dfb2;
      --sentence-bg: rgba(11, 122, 117, 0.06);
      --sentence-line: rgba(11, 122, 117, 0.22);
      --comfort-bg: rgba(11, 122, 117, 0.08);
      --comfort-line: rgba(11, 122, 117, 0.2);
      --font-size: 34px;
      --line-height: 1.75;
      --max-width: 980px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.modal-open {
      overflow: hidden;
    }

    body[data-theme="soft"] {
      --bg: #f6f3ec;
      --panel: #fffefa;
      --ink: #171717;
      --muted: #68635b;
      --line: #d9d1c3;
      --highlight: #dfc6cd;
    }

    body[data-theme="clean"] {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #667085;
      --line: #d0d5dd;
      --highlight: #cbdde2;
    }

    body[data-theme="open"] {
      --bg: #f2f7f4;
      --panel: #fffffb;
      --ink: #102019;
      --muted: #617068;
      --line: #cbd9d1;
      --highlight: #d2decf;
      --line-height: 1.95;
      --max-width: 860px;
    }

    body[data-theme="night"] {
      color-scheme: dark;
      --bg: #111318;
      --panel: #181b22;
      --ink: #f2f4f7;
      --muted: #a4aab5;
      --line: #333844;
      --hairline: rgba(255, 255, 255, 0.11);
      --panel-shadow: 0 18px 46px rgba(0, 0, 0, 0.18);
      --control-bg: rgba(255, 255, 255, 0.08);
      --accent: #55b8ad;
      --accent-ink: #071412;
      --highlight: #d3bdc7;
      --highlight-ink: #111318;
      --mark: #7dd3c7;
      --mark-bg: rgba(125, 211, 199, 0.14);
      --flow-old: rgba(242, 201, 76, 0.22);
      --flow-tag: rgba(242, 201, 76, 0.22);
      --sentence-bg: rgba(85, 184, 173, 0.09);
      --sentence-line: rgba(85, 184, 173, 0.28);
      --comfort-bg: rgba(85, 184, 173, 0.12);
      --comfort-line: rgba(85, 184, 173, 0.3);
    }

    body[data-theme="night"] .input-panel {
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    }

    button, textarea, input, select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100vh;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      gap: 12px;
      padding: 14px 18px;
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      border-bottom: 1px solid var(--hairline);
      backdrop-filter: blur(18px) saturate(1.12);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .action-group {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .primary-actions {
      margin-left: auto;
    }

    .reading-actions {
      gap: 6px;
    }

    .reading-actions.is-reading .button.context-action:disabled {
      display: inline-grid;
      visibility: visible;
      opacity: 0.34;
      pointer-events: none;
    }

    .reading-actions .context-action {
      position: relative;
      width: 42px;
      min-width: 42px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    .sound-control {
      position: relative;
    }

    .reading-actions .context-action::after,
    .sound-control::after {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      z-index: 20;
      max-width: 12rem;
      padding: 6px 9px;
      border: 1px solid var(--hairline);
      border-radius: 7px;
      background: color-mix(in srgb, var(--panel) 94%, var(--bg));
      box-shadow: 0 8px 20px rgba(16, 24, 40, 0.12);
      color: var(--ink);
      content: attr(data-tooltip);
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -4px);
      transition: opacity 140ms ease 420ms, transform 140ms ease 420ms;
      white-space: nowrap;
    }

    .reading-actions .context-action:hover::after,
    .reading-actions .context-action:focus-visible::after,
    .sound-control:hover::after,
    .sound-control:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .reading-actions .paragraph-jump {
      margin-left: 2px;
      border-color: color-mix(in srgb, var(--accent) 22%, var(--line));
      color: color-mix(in srgb, var(--accent) 78%, var(--muted));
    }

    .reading-actions.is-reading .pause-control {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      background: color-mix(in srgb, var(--accent) 8%, var(--panel));
      color: var(--ink);
    }

    .reading-actions.is-reading .pause-control[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent) 16%, var(--panel));
    }

    .reading-actions .stop-control:hover:not(:disabled),
    .reading-actions .stop-control:focus-visible {
      border-color: color-mix(in srgb, #b45b61 48%, var(--line));
      background: color-mix(in srgb, #b45b61 9%, var(--panel));
      color: color-mix(in srgb, #8f3540 82%, var(--ink));
    }

    .pause-control[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      background: color-mix(in srgb, var(--accent) 12%, var(--panel));
      color: var(--ink);
    }

    .control-icon {
      font-size: 19px;
      line-height: 1;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .guide-toggle-wrap {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .guide-caption {
      max-width: 12rem;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .preference-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-left: 2px;
    }

    .document-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .document-icon-button {
      width: 38px;
      min-width: 38px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    .document-icon {
      width: 17px;
      height: 17px;
      display: block;
    }

    .brand {
      font-weight: 800;
      font-size: 22px;
      margin-right: auto;
    }

    .button {
      border: 1px solid var(--line);
      background: var(--control-bg);
      color: var(--ink);
      min-height: 42px;
      padding: 0 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .button:hover:not(:disabled) {
      border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
      background: color-mix(in srgb, var(--control-bg) 80%, var(--panel));
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
    }

    .button.comfort {
      border-color: var(--comfort-line);
      background: var(--comfort-bg);
      color: var(--ink);
      font-weight: 700;
    }

    .button.comfort[aria-pressed="true"] {
      border-color: color-mix(in srgb, var(--accent) 56%, var(--comfort-line));
      background: color-mix(in srgb, var(--comfort-bg) 48%, var(--accent));
      color: var(--accent-ink);
    }

    .button.utility {
      color: var(--muted);
      background: color-mix(in srgb, var(--panel) 78%, var(--bg));
    }

    .button.preference {
      min-height: 36px;
      padding: 0 10px;
      color: color-mix(in srgb, var(--muted) 88%, var(--ink));
      font-size: 14px;
      background: color-mix(in srgb, var(--panel) 90%, var(--bg));
    }

    .highlight-preference {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .highlight-swatch {
      width: 12px;
      height: 12px;
      flex: 0 0 12px;
      border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent);
      border-radius: 50%;
      background: var(--highlight);
    }

    .sound-control {
      width: 38px;
      min-width: 38px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    .sound-icon {
      width: 18px;
      height: 18px;
      display: block;
    }

    .sound-icon[hidden] {
      display: none;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .mode-prompt[hidden] {
      display: none;
    }

    .mode-prompt {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .mode-prompt-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(23, 23, 23, 0.24);
      backdrop-filter: blur(6px);
    }

    .mode-prompt-card {
      position: relative;
      width: min(100%, 440px);
      padding: 28px;
      border: 1px solid var(--hairline);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(23, 23, 23, 0.18);
    }

    .mode-prompt-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .mode-prompt-close:hover {
      border-color: var(--line);
      background: var(--control-bg);
    }

    .mode-prompt-kicker {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .mode-prompt-title {
      max-width: 13em;
      margin: 0 0 10px;
      color: var(--ink);
      font-size: 24px;
      line-height: 1.28;
    }

    .mode-prompt-copy {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .mode-prompt-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .mode-prompt-actions .button {
      flex: 1 1 150px;
    }

    .button.context-action:disabled {
      display: none;
    }

    .control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 15px;
      white-space: nowrap;
      min-height: 38px;
      padding: 0 4px;
    }

    .control input[type="range"] {
      width: 150px;
      accent-color: var(--accent);
    }

    .mode-row {
      padding-top: 0;
    }

    .settings-row {
      padding-top: 2px;
      gap: 14px;
    }

    .reader-shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      gap: clamp(14px, 2vw, 24px);
      padding: clamp(14px, 2vw, 24px);
      min-height: 0;
      align-items: start;
    }

    body.focus-mode .toolbar {
      grid-template-rows: auto;
    }

    body.focus-mode .toolbar-row.settings-row,
    body.focus-mode .input-panel,
    body.focus-mode .notes-panel {
      display: none;
    }

    body.focus-mode .reader-shell {
      grid-template-columns: 1fr;
      padding: 10px;
    }

    body.focus-mode .reader-panel {
      border-color: transparent;
      padding-top: clamp(14px, 2vw, 28px);
    }

    body.browse-mode .toolbar {
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.04);
    }

    body.browse-mode .toolbar-row.settings-row,
    body.browse-mode .input-panel {
      display: none;
    }

    body.browse-mode .reader-shell {
      grid-template-columns: 1fr;
      padding: 10px;
    }

    body.browse-mode .reader-panel {
      min-height: calc(100vh - 86px);
    }

    body.gentle-mode .toolbar {
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.04);
    }

    body.gentle-mode .reader-panel {
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--bg) 35%, transparent), transparent 18%, transparent 82%, color-mix(in srgb, var(--bg) 35%, transparent)),
        var(--panel);
    }

    .toolbar.collapsed .advanced-control,
    .toolbar.collapsed .mode-row,
    .toolbar.collapsed .settings-row {
      display: none;
    }

    .input-panel, .reader-panel, .notes-panel {
      background: var(--panel);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      box-shadow: var(--panel-shadow);
      min-height: 0;
    }

    .input-panel {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 9px;
      padding: 13px;
      align-self: start;
      box-shadow: 0 12px 32px rgba(45, 39, 28, 0.035);
    }

    .panel-title {
      margin: 0;
      font-size: 16px;
      color: var(--muted);
      font-weight: 700;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-heading .button {
      min-height: 34px;
      padding: 0 10px;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 128px;
      max-height: 28vh;
      resize: vertical;
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 13px 14px;
      background: color-mix(in srgb, var(--panel) 84%, #ffffff);
      color: var(--ink);
      line-height: 1.55;
    }

    .input-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .input-panel.has-text textarea {
      min-height: 112px;
      max-height: 24vh;
    }

    .hint {
      display: none;
    }

    .text-meter {
      color: color-mix(in srgb, var(--muted) 82%, var(--ink));
      font-size: 12px;
      white-space: nowrap;
    }

    .reader-panel {
      overflow: auto;
      padding: clamp(22px, 4vw, 56px);
      min-height: calc(100vh - 132px);
    }

    .reader-panel.is-empty {
      padding-top: 0;
    }

    .reader {
      max-width: var(--max-width);
      margin: 0 auto;
      font-family: Georgia, "Times New Roman", "Noto Serif SC", "Songti SC", serif;
      font-size: var(--font-size);
      line-height: var(--line-height);
      letter-spacing: 0;
      white-space: pre-wrap;
    }

    .paragraph {
      margin: 0 0 1.1em;
    }

    .paragraph:last-child {
      margin-bottom: 0;
    }

    .table-wrap {
      width: 100%;
      margin: 1.2em 0 1.35em;
      overflow-x: auto;
      overscroll-behavior-inline: contain;
    }

    .reader-table {
      width: 100%;
      min-width: 34rem;
      border-collapse: collapse;
      font-size: 0.68em;
      line-height: 1.45;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .reader-table th,
    .reader-table td {
      padding: 0.65em 0.8em;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .reader-table th {
      color: var(--ink);
      font-weight: 800;
      background: color-mix(in srgb, var(--flow-old) 48%, var(--panel));
    }

    .reader-table td {
      color: var(--muted);
    }

    .reader-table tr.table-row-current th,
    .reader-table tr.table-row-current td {
      color: var(--ink);
      background: color-mix(in srgb, var(--comfort-bg) 68%, var(--panel));
      box-shadow: inset 0 2px 0 var(--comfort-line), inset 0 -2px 0 var(--comfort-line);
    }

    body.gentle-mode .reader-table tr.table-row-away th,
    body.gentle-mode .reader-table tr.table-row-away td {
      opacity: 0.34;
    }

    body.gentle-mode .reader-table tr.table-row-current th,
    body.gentle-mode .reader-table tr.table-row-current td {
      opacity: 1;
    }

    .token {
      display: inline;
      padding: 0 0.03em;
      border-radius: 4px;
      transition: background-color 180ms ease, color 180ms ease, opacity 260ms ease, box-shadow 220ms ease, text-decoration-color 180ms ease;
    }

    .token strong {
      font-weight: 900;
    }

    .token.active {
      background: var(--highlight);
      color: var(--highlight-ink);
      box-shadow: 0 0 0 0.08em var(--highlight);
    }

    body.gentle-mode .token.active {
      border-radius: 7px;
      box-shadow: 0 0 0 0.14em var(--highlight), 0 0.18em 0.7em rgba(16, 24, 40, 0.08);
      text-decoration-line: underline;
      text-decoration-color: color-mix(in srgb, var(--highlight-ink) 55%, transparent);
      text-decoration-thickness: 0.09em;
      text-underline-offset: 0.2em;
      animation: currentWordAppear 260ms ease-out;
    }

    .sentence-focus {
      background: var(--sentence-bg);
      box-shadow: 0 0 0 0.16em var(--sentence-bg);
      border-bottom: 1px solid var(--sentence-line);
      border-radius: 5px;
    }

    body.gentle-mode .sentence-focus {
      background: color-mix(in srgb, var(--comfort-bg) 78%, transparent);
      box-shadow: 0 0 0 0.18em color-mix(in srgb, var(--comfort-bg) 72%, transparent);
      border-bottom-color: var(--comfort-line);
      animation: none;
    }

    body.gentle-mode .token.gentle-read {
      opacity: 0.48;
    }

    body.gentle-mode .token.gentle-outside {
      opacity: 0.3;
    }

    body.gentle-mode .paragraph.gentle-away {
      opacity: 0.38;
    }

    body.gentle-mode .paragraph.gentle-current {
      opacity: 1;
    }

    @keyframes currentWordAppear {
      from {
        background: color-mix(in srgb, var(--highlight) 35%, transparent);
        box-shadow: 0 0 0 0.02em color-mix(in srgb, var(--highlight) 50%, transparent);
      }
      to {
        background: var(--highlight);
        box-shadow: 0 0 0 0.14em var(--highlight), 0 0.18em 0.7em rgba(16, 24, 40, 0.08);
      }
    }

    .token.flow-link {
      color: #064f86;
      text-decoration-line: underline;
      text-decoration-color: var(--flow-link);
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.18em;
    }

    .token.flow-old {
      background: var(--flow-old);
      box-shadow: 0 0 0 0.08em var(--flow-old);
    }

    .token.flow-new {
      color: #0b5d36;
      text-decoration-line: underline;
      text-decoration-color: rgba(20, 122, 75, 0.55);
      text-decoration-style: dotted;
      text-decoration-thickness: 0.1em;
      text-underline-offset: 0.18em;
    }

    .token.active.flow-link,
    .token.active.flow-old,
    .token.active.flow-new {
      background: var(--highlight);
      color: var(--highlight-ink);
      box-shadow: 0 0 0 0.08em var(--highlight);
      text-decoration-color: currentColor;
    }

    .token.marked-sentence {
      background: var(--mark-bg);
      box-shadow: 0 0 0 0.08em var(--mark-bg);
      text-decoration-line: underline;
      text-decoration-color: color-mix(in srgb, var(--mark) 75%, transparent);
      text-decoration-thickness: 0.1em;
      text-underline-offset: 0.22em;
    }

    .token.active.marked-sentence {
      background: var(--highlight);
      color: var(--highlight-ink);
      box-shadow: 0 0 0 0.08em var(--highlight);
      text-decoration-color: var(--mark);
    }

    .token.review-target {
      background: color-mix(in srgb, var(--comfort-bg) 82%, var(--panel));
      box-shadow: 0 0 0 0.12em var(--comfort-line);
      text-decoration-line: underline;
      text-decoration-color: var(--mark);
      text-decoration-thickness: 0.1em;
      text-underline-offset: 0.2em;
      animation: reviewTargetAppear 420ms ease-out;
    }

    @keyframes reviewTargetAppear {
      from {
        background: transparent;
        box-shadow: 0 0 0 0 transparent;
      }
      to {
        background: color-mix(in srgb, var(--comfort-bg) 82%, var(--panel));
        box-shadow: 0 0 0 0.12em var(--comfort-line);
      }
    }

    .flow-label {
      display: inline-flex;
      align-items: center;
      vertical-align: 0.14em;
      margin-right: 0.45em;
      padding: 0.1em 0.45em;
      border-radius: 999px;
      background: var(--flow-tag);
      color: #4d3900;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.42em;
      font-weight: 800;
      line-height: 1.35;
      white-space: nowrap;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 1rem;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      display: inline-flex;
      align-items: center;
      min-width: 2.4em;
      height: 1.5em;
      padding: 0 0.35em;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      color: var(--ink);
      background: #fff;
      font-weight: 700;
      line-height: 1;
    }

    .swatch.link {
      color: #064f86;
      text-decoration-line: underline;
      text-decoration-color: var(--flow-link);
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.18em;
    }

    .swatch.old {
      background: var(--flow-old);
    }

    .swatch.new {
      color: #0b5d36;
      text-decoration-line: underline;
      text-decoration-color: rgba(20, 122, 75, 0.55);
      text-decoration-style: dotted;
      text-decoration-thickness: 0.1em;
      text-underline-offset: 0.18em;
    }

    .empty-state {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(16px, 1.45vw, 19px);
      line-height: 1.55;
    }

    .empty-state-card {
      max-width: 720px;
      margin: -88px auto 0;
    }

    .empty-state-title {
      margin: 0 0 0.35rem;
      color: var(--ink);
      font-size: clamp(25px, 3vw, 34px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .empty-state-lead {
      margin: 0 0 0.9rem;
      color: var(--muted);
    }

    .onboarding-list {
      display: grid;
      gap: 0.55rem;
      margin: 0 0 0.9rem;
      padding: 0;
      list-style: none;
    }

    .onboarding-list li {
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr);
      gap: 0.75rem;
      align-items: start;
    }

    .onboarding-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: 999px;
      background: var(--comfort-bg);
      color: var(--accent);
      font-size: 14px;
      font-weight: 800;
    }

    .onboarding-list strong {
      display: block;
      color: var(--ink);
      font-size: 1.02em;
    }

    .empty-state-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.92em;
    }

    .empty-state-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      margin: 0 0 0.8rem;
    }

    .sample-button {
      min-height: 42px;
      padding: 0 1rem;
      border: 1px solid var(--comfort-line);
      border-radius: 999px;
      background: var(--comfort-bg);
      color: var(--ink);
      font: inherit;
      font-size: 0.9em;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .sample-button:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--comfort-line) 70%, var(--accent));
      background: color-mix(in srgb, var(--comfort-bg) 78%, white);
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      min-width: 0;
    }

    .notes-panel {
      grid-column: 1 / -1;
      padding: 16px;
    }

    .notes-panel summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 800;
    }

    .notes-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .notes-output {
      display: grid;
      grid-template-columns: minmax(220px, 0.9fr) 1.4fr;
      gap: 16px;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.55;
    }

    .note-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: color-mix(in srgb, var(--panel) 92%, var(--bg));
    }

    .note-card h2 {
      margin: 0 0 8px;
      font-size: 15px;
      color: var(--muted);
    }

    .notes-footnote {
      grid-column: 1 / -1;
      color: color-mix(in srgb, var(--muted) 86%, var(--panel));
      font-size: 13px;
      line-height: 1.45;
    }

    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .keyword-list li {
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      background: var(--flow-old);
    }

    .note-link {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      text-decoration: underline;
      text-decoration-color: var(--comfort-line);
      text-underline-offset: 0.18em;
      cursor: pointer;
    }

    .note-link:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    .key-sentence-list {
      margin: 0;
      padding-left: 1.25rem;
    }

    .key-sentence-list li {
      margin: 0.45rem 0;
    }

    .note-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }

    .progress-pill {
      display: none;
      position: sticky;
      top: 0;
      z-index: 2;
      width: fit-content;
      margin: 0 auto 1rem;
      padding: 0.28rem 0.65rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.2;
      backdrop-filter: blur(8px);
    }

    .progress-pill.visible {
      display: block;
    }

    .comfort-note {
      display: none;
      max-width: var(--max-width);
      margin: 0 auto 1rem;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--comfort-line);
      border-radius: 8px;
      background: var(--comfort-bg);
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }

    .comfort-note.visible {
      display: block;
    }

    .gentle-guide {
      display: none;
      position: sticky;
      top: 0.35rem;
      z-index: 3;
      align-items: flex-start;
      gap: 0.85rem;
      max-width: var(--max-width);
      margin: 0 auto 1rem;
      padding: 0.75rem 0.85rem;
      border-left: 4px solid var(--comfort-line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--panel) 78%, var(--comfort-bg));
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      box-shadow: 0 12px 28px rgba(16, 24, 40, 0.07);
      backdrop-filter: blur(10px);
    }

    .gentle-guide-content {
      min-width: 0;
      flex: 1 1 auto;
    }

    .gentle-guide-mark {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 10px;
      font-size: 13px;
      white-space: nowrap;
    }

    body.gentle-mode .gentle-guide.visible {
      display: flex;
    }

    @media (max-width: 900px) {
      .toolbar {
        gap: 6px;
        padding: 8px 10px;
      }

      .toolbar-row {
        gap: 6px;
      }

      .brand {
        flex: 0 1 auto;
        font-size: 18px;
        line-height: 1.25;
      }

      .action-group,
      .primary-actions {
        margin-left: 0;
      }

      .support-actions {
        flex: 0 1 auto;
      }

      .guide-toggle-wrap {
        flex: 0 1 auto;
      }

      .guide-caption {
        display: none;
      }

      .button {
        min-height: 36px;
        padding: 0 9px;
        font-size: 15px;
      }

      .toolbar-row.settings-row {
        align-items: stretch;
      }

      .control {
        width: 100%;
        justify-content: space-between;
      }

      .control input[type="range"] {
        width: min(52vw, 220px);
      }

      .reader-shell {
        grid-template-columns: 1fr;
        gap: 7px;
        padding: 8px;
      }

      .gentle-guide {
        flex-wrap: wrap;
      }

      .gentle-guide-mark {
        margin-left: auto;
      }

      .input-panel {
        gap: 6px;
      }

      .panel-title {
        font-size: 15px;
      }

      .panel-heading .button {
        min-height: 32px;
        padding: 0 9px;
        font-size: 13px;
      }

      textarea {
        min-height: 100px;
        max-height: 18vh;
        font-size: 16px;
      }

      .input-panel.has-text textarea {
        min-height: 92px;
        max-height: 16vh;
      }

      .hint,
      .status {
        font-size: 13px;
      }

      .input-panel,
      .reader-panel,
      .notes-panel {
        padding: 10px;
      }

      .reader-panel {
        padding: 16px 10px;
        min-height: 54vh;
      }

      .reader-panel.is-empty {
        padding-top: 0;
      }

      .empty-state-card {
        margin-top: -74px;
      }

      .notes-output {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="toolbar-row">
        <div class="brand">伴读 <span style="font-weight: 600; color: var(--muted);">Reader</span></div>
        <div class="action-group primary-actions">
          <button class="button primary" id="playButton" type="button">开始伴读</button>
        </div>
        <div class="action-group reading-actions">
          <button class="button utility context-action pause-control" id="pauseButton" type="button" aria-label="暂停" title="暂停" aria-pressed="false" disabled>
            <span class="control-icon" id="pauseIcon" data-icon aria-hidden="true">⏸</span>
            <span class="sr-only" id="pauseLabel">暂停</span>
          </button>
          <button class="button utility context-action paragraph-jump" id="previousParagraphButton" type="button" aria-label="上一段" title="上一段" disabled>
            <span class="control-icon" data-icon aria-hidden="true">◀◀</span>
            <span class="sr-only">上一段</span>
          </button>
          <button class="button utility context-action" id="previousButton" type="button" aria-label="上一句" title="上一句" disabled>
            <span class="control-icon" data-icon aria-hidden="true">◀</span>
            <span class="sr-only">上一句</span>
          </button>
          <button class="button utility context-action" id="nextButton" type="button" aria-label="下一句" title="下一句" disabled>
            <span class="control-icon" data-icon aria-hidden="true">▶</span>
            <span class="sr-only">下一句</span>
          </button>
          <button class="button utility context-action paragraph-jump" id="nextParagraphButton" type="button" aria-label="下一段" title="下一段" disabled>
            <span class="control-icon" data-icon aria-hidden="true">▶▶</span>
            <span class="sr-only">下一段</span>
          </button>
          <button class="button utility context-action stop-control" id="stopButton" type="button" aria-label="停止" title="停止" disabled>
            <span class="control-icon" data-icon aria-hidden="true">⏹</span>
            <span class="sr-only">停止</span>
          </button>
        </div>
        <div class="action-group support-actions">
          <span class="guide-toggle-wrap">
            <button class="button comfort" id="gentleButton" type="button" aria-pressed="false">专注阅读：关</button>
            <span class="guide-caption" id="gentleHint">当前句浮现，其他文字退后。</span>
          </span>
          <span class="document-actions">
            <button class="button utility preference document-icon-button" id="topButton" type="button" aria-label="回到顶部" title="回到顶部" hidden>
              <svg class="document-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 4h14"></path>
                <path d="M12 19V4"></path>
                <path d="m6 10 6-6 6 6"></path>
              </svg>
              <span class="sr-only" id="topLabel">回到顶部</span>
            </button>
            <button class="button utility preference document-icon-button" id="newTextButton" type="button" aria-label="清空文字" title="清空文字" hidden>
              <svg class="document-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 4h12"></path>
                <path d="M9 4V2.5h6V4"></path>
                <path d="M7 4l1 17h8l1-17"></path>
                <path d="M10 9v8"></path>
                <path d="M14 9v8"></path>
              </svg>
              <span class="sr-only" id="clearTextLabel">清空文字</span>
            </button>
          </span>
          <span class="preference-actions">
            <button class="button utility preference sound-control" id="voiceButton" type="button" aria-label="朗读声音：开" title="朗读声音：开" aria-pressed="true">
              <svg class="sound-icon" data-sound-icon="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
                <path d="M16 9.2a4 4 0 0 1 0 5.6"></path>
                <path d="M18.5 6.8a7.5 7.5 0 0 1 0 10.4"></path>
              </svg>
              <svg class="sound-icon" data-sound-icon="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M4 9v6h4l5 4V5L8 9H4Z"></path>
                <path d="m17 9 4 6"></path>
                <path d="m21 9-4 6"></path>
              </svg>
            </button>
            <button class="button utility preference" id="menuButton" type="button" aria-expanded="false">设置</button>
          </span>
        </div>
      </div>
      <div class="toolbar-row mode-row">
        <button class="button advanced-control" id="flowButton" type="button" aria-pressed="true">结构提示：自动</button>
        <button class="button advanced-control" id="bionicButton" type="button" aria-pressed="false">英文词首加粗：关闭</button>
        <button class="button advanced-control" id="anchorButton" type="button" aria-pressed="false">句子锚点：关闭</button>
        <button class="button advanced-control" id="intensityButton" type="button" hidden>结构强度：轻</button>
        <button class="button advanced-control" id="languageButton" type="button">中文 / English</button>
      </div>
      <div class="toolbar-row settings-row">
        <label class="control">语速 <input id="rateInput" type="range" min="0.7" max="2" step="0.05" value="1.15"><span id="rateValue">1.15x</span></label>
        <label class="control">字号 <input id="fontInput" type="range" min="24" max="64" step="2" value="38"><span id="fontValue">38px</span></label>
        <label class="control">行距 <input id="lineInput" type="range" min="1.35" max="2.2" step="0.05" value="1.75"><span id="lineValue">1.75</span></label>
        <label class="control">宽度 <input id="widthInput" type="range" min="620" max="1280" step="20" value="980"><span id="widthValue">980px</span></label>
        <button class="button utility preference highlight-preference" id="highlightButton" type="button">
          <span class="highlight-swatch" aria-hidden="true"></span>
          <span id="highlightLabel">当前词高光：雾玫瑰</span>
        </button>
        <button class="button" id="themeButton" type="button">主题：柔和</button>
      </div>
    </header>

    <main class="reader-shell">
      <section class="input-panel">
        <div class="panel-heading">
          <h1 class="panel-title">放入文字</h1>
          <button class="button utility" id="clipboardButton" type="button">读取剪贴板</button>
        </div>
        <textarea id="sourceText" placeholder="把想读的文字粘贴到这里。"></textarea>
        <div class="input-meta">
          <div class="status" id="status">粘贴一段想读的文字。</div>
          <div class="text-meter" id="textMeter">当前：0 字符</div>
          <div class="hint">也可以点“读取剪贴板”。如果失败，手动粘贴就好。</div>
        </div>
      </section>

      <section class="reader-panel" id="readerPanel">
        <div class="progress-pill" id="progressPill">第 1 段 / 共 1 段</div>
        <div class="comfort-note" id="comfortNote">读一点也算。走神了也没关系，从高亮处回来就好。</div>
        <div class="gentle-guide" id="gentleGuide">
          <div class="gentle-guide-content" id="gentleGuideContent">这一句会显示在这里。</div>
          <button class="button utility context-action gentle-guide-mark" id="markButton" type="button" disabled>标记这一句</button>
        </div>
        <div class="reader" id="reader">
          <div class="empty-state">文字放进来后，点“开始伴读”。我会用大字号和高亮陪你往下读。</div>
        </div>
      </section>

      <details class="notes-panel" id="notesPanel">
        <summary>回看线索：词 / 句</summary>
        <div class="notes-tools">
          <button class="button" id="copyNotesButton" type="button">复制回看草稿</button>
        </div>
        <div class="notes-output" id="notesOutput">
          <div class="note-card">这里会用本地规则找少量回看线索，帮你第二遍、第 N 遍回到文本。它不是 AI 总结，也不会联网。</div>
        </div>
      </details>

    </main>
  </div>

  <div class="mode-prompt" id="guidePrompt" hidden>
    <div class="mode-prompt-backdrop" data-guide-prompt-dismiss></div>
    <section class="mode-prompt-card" role="dialog" aria-modal="true" aria-labelledby="guidePromptTitle" aria-describedby="guidePromptCopy">
      <button class="mode-prompt-close" id="guidePromptClose" type="button" aria-label="关闭">×</button>
      <p class="mode-prompt-kicker" id="guidePromptKicker">第一次使用</p>
      <h2 class="mode-prompt-title" id="guidePromptTitle">试试专注阅读？</h2>
      <p class="mode-prompt-copy" id="guidePromptCopy">当前句会浮现，其他文字轻轻退后。它不会自动播放声音，只会先帮你把阅读范围变得更清楚。</p>
      <div class="mode-prompt-actions">
        <button class="button primary" id="guidePromptAccept" type="button">体验专注阅读</button>
        <button class="button utility" id="guidePromptDecline" type="button">先不用</button>
      </div>
    </section>
  </div>

  <script>
    const sourceText = document.querySelector("#sourceText");
    const reader = document.querySelector("#reader");
    const readerPanel = document.querySelector("#readerPanel");
    const clipboardButton = document.querySelector("#clipboardButton");
    const playButton = document.querySelector("#playButton");
    const readingActions = document.querySelector(".reading-actions");
    const topButton = document.querySelector("#topButton");
    const newTextButton = document.querySelector("#newTextButton");
    const voiceButton = document.querySelector("#voiceButton");
    const menuButton = document.querySelector("#menuButton");
    const markButton = document.querySelector("#markButton");
    const previousButton = document.querySelector("#previousButton");
    const pauseButton = document.querySelector("#pauseButton");
    const stopButton = document.querySelector("#stopButton");
    const previousParagraphButton = document.querySelector("#previousParagraphButton");
    const nextParagraphButton = document.querySelector("#nextParagraphButton");
    const flowButton = document.querySelector("#flowButton");
    const bionicButton = document.querySelector("#bionicButton");
    const nextButton = document.querySelector("#nextButton");
    const anchorButton = document.querySelector("#anchorButton");
    const intensityButton = document.querySelector("#intensityButton");
    const gentleButton = document.querySelector("#gentleButton");
    const gentleHint = document.querySelector("#gentleHint");
    const languageButton = document.querySelector("#languageButton");
    const themeButton = document.querySelector("#themeButton");
    const progressPill = document.querySelector("#progressPill");
    const comfortNote = document.querySelector("#comfortNote");
    const gentleGuide = document.querySelector("#gentleGuide");
    const gentleGuideContent = document.querySelector("#gentleGuideContent");
    const notesPanel = document.querySelector("#notesPanel");
    const copyNotesButton = document.querySelector("#copyNotesButton");
    const notesOutput = document.querySelector("#notesOutput");
    const inputPanel = document.querySelector(".input-panel");
    const guidePrompt = document.querySelector("#guidePrompt");
    const guidePromptKicker = document.querySelector("#guidePromptKicker");
    const guidePromptTitle = document.querySelector("#guidePromptTitle");
    const guidePromptCopy = document.querySelector("#guidePromptCopy");
    const guidePromptAccept = document.querySelector("#guidePromptAccept");
    const guidePromptDecline = document.querySelector("#guidePromptDecline");
    const guidePromptClose = document.querySelector("#guidePromptClose");
    const rateInput = document.querySelector("#rateInput");
    const fontInput = document.querySelector("#fontInput");
    const lineInput = document.querySelector("#lineInput");
    const widthInput = document.querySelector("#widthInput");
    const highlightButton = document.querySelector("#highlightButton");
    const highlightLabel = document.querySelector("#highlightLabel");
    const rateValue = document.querySelector("#rateValue");
    const fontValue = document.querySelector("#fontValue");
    const lineValue = document.querySelector("#lineValue");
    const widthValue = document.querySelector("#widthValue");
    const status = document.querySelector("#status");
    const textMeter = document.querySelector("#textMeter");

    let tokens = [];
    let tableBlocks = [];
    let activeIndex = -1;
    let utterance = null;
    let speechVoices = [];
    let speechChunks = [];
    let speechChunkIndex = -1;
    let playStartedAt = 0;
    let flowMode = "auto";
    let bionicMode = "auto";
    let annotationIntensity = "light";
    let currentTheme = "soft";
    let highlightPalette = "rose";
    let gentleMode = false;
    let sentenceAnchorEnabled = false;
