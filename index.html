    function refreshSpeechVoices() {
      speechVoices = window.speechSynthesis.getVoices().filter(voice => voice.lang);
    }

    function speechVoiceForText(text, context = sourceText.value) {
      refreshSpeechVoices();
      const target = speechLanguageForText(text, context);
      const targetLocales = languageProfiles[target]?.voiceLocales || languageProfiles.en.voiceLocales;
      const targetRoot = target.split("-")[0];
      return speechVoices
        .map(voice => {
          const locale = voice.lang.toLowerCase().replace("_", "-");
          const name = voice.name.toLowerCase();
          let score = 0;
          if (locale === targetLocales[0]) score += 100;
          else if (targetLocales.some(item => locale === item || locale.startsWith(`${item}-`))) score += 60;
          else if (locale.startsWith(targetRoot)) score += 20;
          if (voice.localService) score += 15;
          if (/premium|enhanced|natural|neural|siri/.test(name)) score += 10;
          score += speechVoiceQualityScore(name, target);
          return { voice, score };
        })
        .filter(item => item.score >= 20)
        .sort((a, b) => b.score - a.score)[0]?.voice || null;
    }

    function speechLanguageForText(text, context = sourceText.value) {
      const value = String(text || "");
      const numbers = value.match(/[\p{N}]/gu)?.length || 0;
      const letters = value.match(/[\p{L}]/gu)?.length || 0;
      const mostlyNumeric = numbers > 0 && numbers >= Math.max(1, letters * 2);
      if (mostlyNumeric) {
        const contextWithoutNumbers = String(context || "").replace(/[\p{N}]/gu, " ");
        return detectTextLanguage(contextWithoutNumbers) || detectTextLanguage(value) || "en";
      }
      return detectTextLanguage(value) || "en";
    }

    function speechLocaleForLanguage(language) {
      return languageProfiles[language]?.voiceLocales?.[0] || languageProfiles.en.voiceLocales[0];
    }

    function speechVoiceQualityScore(name, language) {
      if (language !== "en") return 0;
      if (/\b(samantha|alex|ava|karen|fiona|daniel)\b/.test(name)) return 80;
      if (/\b(eddy|flo|sandy|reed|shelley)\b/.test(name)) return 35;
      if (/\b(albert|bad news|bahh|bells|boing|bubbles|cellos|fred|good news|jester|junior|organ|ralph|superstar|trinoids|whisper|wobble|zarvox)\b/.test(name)) return -80;
      return 0;
    }

    // Group short sentences to reduce abrupt system-voice handoffs.
    function speechChunksForText(source, maxLength = 460) {
      const sentences = readingUnits(source);
      const chunks = [];
      let pending = null;

      const flushPending = () => {
        if (pending) chunks.push(pending);
        pending = null;
      };

      for (const sentence of sentences) {
        if (sentence.kind === "table-row") {
          flushPending();
          chunks.push({ start: sentence.start, end: sentence.end });
          continue;
        }
        if (sentence.end - sentence.start <= maxLength) {
          const sentenceLanguage = speechLanguageForText(sentence.text, source);
          const pendingLanguage = pending ? speechLanguageForText(source.slice(pending.start, pending.end), source) : null;
          if (pending && sentence.end - pending.start <= maxLength && sentenceLanguage === pendingLanguage) {
            pending.end = sentence.end;
          } else {
            flushPending();
            pending = { start: sentence.start, end: sentence.end };
          }
          continue;
        }

        flushPending();
        let start = sentence.start;
        while (start < sentence.end) {
          let end = Math.min(sentence.end, start + maxLength);
          if (end < sentence.end) {
            const part = source.slice(start, end);
            const breakPoints = [
              part.lastIndexOf("\n"),
              part.lastIndexOf(" "),
              part.lastIndexOf("，"),
              part.lastIndexOf(","),
              part.lastIndexOf("；"),
              part.lastIndexOf(";")
            ];
            const breakPoint = Math.max(...breakPoints);
            if (breakPoint > maxLength * 0.55) {
              end = start + breakPoint + (/[，,；;]/.test(part[breakPoint]) ? 1 : 0);
            }
          }

          if (end <= start) end = Math.min(sentence.end, start + maxLength);
          const splitToken = tokens.find(token => token.start < end && token.end > end);
          if (splitToken && splitToken.start > start) end = splitToken.start;
          chunks.push({ start, end });
          start = end;
        }
      }

      flushPending();

      return chunks.length ? chunks : [{ start: 0, end: source.length }];
    }

    function speechChunkIndexForToken(index) {
      const token = tokens[index];
      if (!token || !speechChunks.length) return -1;
      const found = speechChunks.findIndex(chunk => token.start >= chunk.start && token.start < chunk.end);
      return found >= 0 ? found : speechChunks.length - 1;
    }

    function firstTokenAtOrAfter(charIndex) {
      return tokens.findIndex(token => token.start >= charIndex);
    }

    function normalizeForSpeech(text) {
      return text.replace(/\t+/g, " ").replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function lowerToken(text) {
      return text.toLowerCase().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
    }

    function roughWordCount(text) {
      const wordMatches = text.match(/[\p{L}\p{N}]+(?:['’\u2011-][\p{L}\p{N}]+)*/gu) || [];
      const nonCjkWords = wordMatches.filter(word => !/[\u3400-\u9fff]/.test(word)).length;
      const cjkChars = text.match(/[\u3400-\u9fff]/g)?.length || 0;
      return nonCjkWords + Math.ceil(cjkChars / 2);
    }

    function cjkRatio(text) {
      const visible = Array.from(text).filter(char => !/\s/.test(char));
      if (!visible.length) return 0;
      const cjk = visible.filter(char => /[\u3400-\u9fff]/.test(char)).length;
      return cjk / visible.length;
    }

    function detectScriptLanguage(text) {
      const visible = Array.from(text).filter(char => !/\s/.test(char));
      if (!visible.length) return "";

      const kanaCount = visible.filter(char => /[\u3040-\u30ff]/.test(char)).length;
      const hangulCount = visible.filter(char => /[\uac00-\ud7af]/.test(char)).length;
      const arabicCount = visible.filter(char => /[\u0600-\u06ff]/.test(char)).length;
      const cyrillicCount = visible.filter(char => /[\u0400-\u04ff]/.test(char)).length;

      if (kanaCount / visible.length > 0.04) return "ja";
      if (hangulCount / visible.length > 0.2) return "ko";
      if (arabicCount / visible.length > 0.2) return "ar";
      if (cyrillicCount / visible.length > 0.2) return "ru";
      if (cjkRatio(text) > 0.35) return "zh";
      return "";
    }

    function detectTextLanguage(text) {
      const scriptLanguage = detectScriptLanguage(text);
      if (scriptLanguage) return scriptLanguage;

      const words = text.toLocaleLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
      if (words.length < 3) return "en";

      const scores = Object.entries(languageProfiles)
        .filter(([, profile]) => profile.hints.length)
        .map(([language, profile]) => ({
          language,
          score: words.filter(word => word.length > 1 && profile.hints.includes(word)).length
        }))
        .sort((a, b) => b.score - a.score);

      const strongest = scores[0];
      const runnerUp = scores[1];
      if (strongest && strongest.score >= 2 && (!runnerUp || strongest.score > runnerUp.score)) {
        return strongest.language;
      }
      return "en";
    }

    function effectiveFlowMode(source) {
      if (flowMode !== "auto") return flowMode;
      const language = detectTextLanguage(source);
      return language === "zh" || language === "en" ? language : "off";
    }

    const segmenterCache = new Map();

    function segmenterForText(text) {
      if (typeof Intl === "undefined" || !Intl.Segmenter) return null;
      const language = detectTextLanguage(text);
      const locale = languageProfiles[language]?.voiceLocales?.[0] || "en";
      if (!segmenterCache.has(locale)) {
        segmenterCache.set(locale, new Intl.Segmenter(locale, { granularity: "word" }));
      }
      return segmenterCache.get(locale);
    }

    function splitSentences(text) {
      const source = text.trim();
      if (!source) return [];
      const urlRanges = Array.from(source.matchAll(/\b(?:https?:\/\/|www\.)[^\s<>"'，。！？；]+/giu))
        .map(match => ({ start: match.index, end: match.index + match[0].length }));
      const isInsideURL = index => urlRanges.some(range => index >= range.start && index < range.end);
      const sentences = [];
      let start = 0;

      for (let index = 0; index < source.length; index += 1) {
        if (!/[.!?。！？]/.test(source[index]) || isInsideURL(index)) continue;
        const end = index + 1;
        const sentence = source.slice(start, end);
        if (sentence.trim()) sentences.push({ text: sentence, start, end });
        start = end;
      }

      if (start < source.length) {
        const sentence = source.slice(start);
        if (sentence.trim()) sentences.push({ text: sentence, start, end: source.length });
      }

      return sentences;
    }

    function rowsFromTableElement(table) {
      const rows = Array.from(table.rows)
        .map(row => {
          const inHeader = row.parentElement?.tagName?.toLowerCase() === "thead";
          return Array.from(row.cells).map(cell => ({
            text: cell.textContent.replace(/\s+/g, " ").trim(),
            header: inHeader || cell.tagName.toLowerCase() === "th"
          }));
        })
        .filter(row => row.length && row.some(cell => cell.text));

      return rows;
    }

    function shiftTableBlock(block, offset) {
      return {
        ...block,
        start: block.start + offset,
        end: block.end + offset,
        rows: block.rows.map(row => ({
          ...row,
          start: row.start + offset,
          end: row.end + offset,
          cells: row.cells.map(cell => ({
            ...cell,
            start: cell.start + offset,
            end: cell.end + offset
          }))
        }))
      };
    }

    function parseClipboardContent(html) {
      if (!html || typeof DOMParser === "undefined") return null;
      const documentFragment = new DOMParser().parseFromString(html, "text/html");
      const blockTags = new Set([
        "ADDRESS", "ARTICLE", "ASIDE", "BLOCKQUOTE", "DD", "DIV", "DL", "DT",
        "FIELDSET", "FIGCAPTION", "FIGURE", "FOOTER", "FORM", "H1", "H2", "H3",
        "H4", "H5", "H6", "HEADER", "LI", "MAIN", "NAV", "OL", "P", "PRE",
        "SECTION", "SUMMARY", "TR", "UL"
      ]);
      const ignoredTags = new Set(["HEAD", "SCRIPT", "STYLE", "TITLE", "META", "LINK"]);
      const parts = [];
      const tableBlocks = [];

      const currentText = () => parts.join("");

      const appendText = (value, preserveWhitespace = false) => {
        let text = String(value || "").replace(/\u00a0/g, " ").replace(/\r\n?/g, "\n");
        if (!preserveWhitespace) text = text.replace(/\s+/g, " ");
        if (text) parts.push(text);
      };

      const appendBreak = (count = 2) => {
        while (parts.length && /[ \t]$/.test(parts[parts.length - 1])) {
          parts[parts.length - 1] = parts[parts.length - 1].replace(/[ \t]+$/, "");
          if (!parts[parts.length - 1]) parts.pop();
        }
        const trailing = currentText().match(/\n*$/)?.[0].length || 0;
        if (trailing < count) parts.push("\n".repeat(count - trailing));
      };

      const walk = (node, preserveWhitespace = false) => {
        if (node.nodeType === Node.TEXT_NODE) {
          appendText(node.nodeValue, preserveWhitespace);
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return;

        const tag = node.tagName;
        if (ignoredTags.has(tag)) return;
        if (tag === "TABLE") {
          const rows = rowsFromTableElement(node);
          if (!rows.length) return;
          appendBreak();
          const start = currentText().length;
          const tableText = rows.map(row => row.map(cell => cell.text).join("\t")).join("\n");
          parts.push(tableText);
          tableBlocks.push(tableBlockFromRows(rows, start));
          appendBreak();
          return;
        }
        if (tag === "BR") {
          appendBreak(1);
          return;
        }

        const isBlock = blockTags.has(tag);
        if (isBlock) appendBreak();
        for (const child of node.childNodes) walk(child, preserveWhitespace || tag === "PRE");
        if (isBlock) appendBreak();
      };

      for (const child of documentFragment.body.childNodes) walk(child);
      const rawText = currentText();
      const text = rawText.trim();
      if (!text || !tableBlocks.length) return null;
      const leadingOffset = rawText.length - rawText.trimStart().length;
      return {
        text,
        tableBlocks: tableBlocks.map(block => shiftTableBlock(block, -leadingOffset))
      };
    }

    function tableBlockFromRows(rows, start = 0) {
      let cursor = start;
      const positionedRows = rows.map((row, rowIndex) => {
        const rowStart = cursor;
        const cells = row.map((cell, cellIndex) => {
          const cellStart = cursor;
          cursor += cell.text.length;
          const cellEnd = cursor;
          if (cellIndex < row.length - 1) cursor += 1;
          return { ...cell, start: cellStart, end: cellEnd };
        });
        const rowEnd = cursor;
        if (rowIndex < rows.length - 1) cursor += 1;
        return {
          start: rowStart,
          end: rowEnd,
          cells,
          text: cells.map(cell => cell.text).join("\t"),
          rowIndex
        };
      });

      return { start, end: cursor, rows: positionedRows };
    }

    function offsetUnits(units, offset) {
      return units.map(unit => ({
        ...unit,
        start: unit.start + offset,
        end: unit.end + offset
      }));
    }

    function normalReadingUnits(text, offset = 0) {
      const leadingWhitespace = text.length - text.trimStart().length;
      return offsetUnits(splitSentences(text), offset + leadingWhitespace);
    }

    function readingUnits(text) {
      const source = text.trim();
      if (!source) return [];
      const blocks = tableBlocks
        .filter(block => block.start >= 0 && block.end <= source.length)
        .sort((a, b) => a.start - b.start);
      if (!blocks.length) return splitSentences(source);

      const units = [];
      let cursor = 0;
      for (const block of blocks) {
        if (block.start > cursor) {
          units.push(...normalReadingUnits(source.slice(cursor, block.start), cursor));
        }
        units.push(...block.rows.map(row => ({
          ...row,
          kind: "table-row",
          tableStart: block.start,
          tableEnd: block.end
        })));
        cursor = block.end;
      }
      if (cursor < source.length) {
        units.push(...normalReadingUnits(source.slice(cursor), cursor));
      }
      return units;
    }

    function readingUnitForToken(index) {
      const source = sourceText.value.trim();
      if (!source || index < 0 || !tokens[index]) return null;
      return readingUnits(source).find(unit => tokens[index].start >= unit.start && tokens[index].start < unit.end) || null;
    }

    function currentUnitIsTableRow() {
      return readingUnitForToken(activeIndex)?.kind === "table-row";
    }

    function loadClipboardContent(content) {
      if (!content?.text?.trim()) {
        setStatus(t("clipboardEmpty"));
        return;
      }
      if (content.text.trim() === sourceText.value.trim()) {
        setStatus(t("clipboardUnchanged"));
        return;
      }
      sourceText.value = content.text;
      tableBlocks = content.tableBlocks || [];
      rebuildTokens();
      sourceText.focus();
      setStatus(t("clipboardRichLoaded"));
      openGuidePrompt();
    }

    function paragraphRanges(text) {
      const source = text.trim();
      if (!source) return [];
      const ranges = [];
      const pattern = /\n{2,}/g;
      let start = 0;
      let match;

      while ((match = pattern.exec(source)) !== null) {
        if (match.index > start) {
          ranges.push({ start, end: match.index });
        }
        start = match.index + match[0].length;
      }

      if (start < source.length) {
        ranges.push({ start, end: source.length });
      }

      return ranges.length ? ranges : [{ start: 0, end: source.length }];
    }

    function paragraphIndexForToken(index) {
      const source = sourceText.value.trim();
      if (!source || index < 0 || !tokens[index]) return -1;
      const ranges = paragraphRanges(source);
      return ranges.findIndex(range => tokens[index].start >= range.start && tokens[index].start <= range.end);
    }

    function sentenceRangeForToken(index) {
      const source = sourceText.value.trim();
      if (!source || index < 0 || !tokens[index]) return null;
      return readingUnits(source).find(sentence => tokens[index].start >= sentence.start && tokens[index].start < sentence.end) || null;
    }

    function sentenceIndexForToken(index) {
      const source = sourceText.value.trim();
      if (!source || index < 0 || !tokens[index]) return -1;
      return readingUnits(source).findIndex(sentence => tokens[index].start >= sentence.start && tokens[index].start < sentence.end);
    }

    function previousSentenceTokenIndex() {
      const source = sourceText.value.trim();
      const currentSentenceIndex = sentenceIndexForToken(activeIndex);
      if (!source || currentSentenceIndex <= 0) return -1;
      const previousSentence = readingUnits(source)[currentSentenceIndex - 1];
      return previousSentence ? tokenIndexForChar(previousSentence.start) : -1;
    }

    function nextSentenceTokenIndex() {
      const source = sourceText.value.trim();
      const sentences = readingUnits(source);
      const currentSentenceIndex = sentenceIndexForToken(activeIndex);
      if (!source || currentSentenceIndex < 0 || currentSentenceIndex >= sentences.length - 1) return -1;
      const nextSentence = sentences[currentSentenceIndex + 1];
      return nextSentence ? tokenIndexForChar(nextSentence.start) : -1;
    }

    function previousParagraphTokenIndex() {
      const source = sourceText.value.trim();
      const currentParagraphIndex = paragraphIndexForToken(activeIndex);
      if (!source || currentParagraphIndex <= 0) return -1;
      const previousParagraph = paragraphRanges(source)[currentParagraphIndex - 1];
      return previousParagraph ? tokenIndexForChar(previousParagraph.start) : -1;
    }

    function nextParagraphTokenIndex() {
      const source = sourceText.value.trim();
      const paragraphs = paragraphRanges(source);
      const currentParagraphIndex = paragraphIndexForToken(activeIndex);
      if (!source || currentParagraphIndex < 0 || currentParagraphIndex >= paragraphs.length - 1) return -1;
      return tokenIndexForChar(paragraphs[currentParagraphIndex + 1].start);
    }

    function connectorLabelForSentence(sentenceText) {
      const normalized = sentenceText.toLowerCase().replace(/\s+/g, " ").trim();
      for (const group of connectorGroups) {
        if (group.words.some(word => normalized.startsWith(word + " ") || normalized.includes(" " + word + " "))) {
          return group.label;
        }
      }
      return "";
    }

    function zhConnectorLabelForSentence(sentenceText) {
      for (const group of zhConnectorGroups) {
        if (group.words.some(word => sentenceText.includes(word))) {
          return group.label;
        }
      }
      if (/[?？]$/.test(sentenceText.trim())) return "问题";
      return "";
    }

    function tokenize(text) {
      const source = text.trim();
      if (!source) return [];

      const activeSegmenter = segmenterForText(source);
      if (activeSegmenter) {
        return Array.from(activeSegmenter.segment(source))
          .filter(part => part.isWordLike || /[，。！？；：、,.!?;:]/.test(part.segment))
          .map(part => ({
            text: part.segment,
            start: part.index,
            end: part.index + part.segment.length,
            flow: ""
          }));
      }

      const matches = source.matchAll(/[\p{Script=Han}]{1,4}|[\p{L}\p{N}]+(?:['’\u2011-][\p{L}\p{N}]+)*|[^\s]/gu);
      return Array.from(matches).map(match => ({
        text: match[0],
        start: match.index,
        end: match.index + match[0].length,
        flow: ""
      }));
    }

    function noteTokens(text) {
      const source = text.trim();
      if (!source) return [];
      const matches = source.matchAll(/[\u3400-\u9fff]{2,6}|[\p{L}][\p{L}\p{N}]+(?:['’\u2011-][\p{L}\p{N}]+)*/gu);
      return Array.from(matches).map(match => ({
        text: match[0],
        index: match.index,
        key: /[\u3400-\u9fff]/.test(match[0]) ? match[0] : lowerToken(match[0])
      }));
    }

    function isUsefulNoteToken(token, stopWordSet = stopWords) {
      if (!token.key) return false;
      if (/^[0-9]+$/.test(token.key)) return false;
      if (/[\u3400-\u9fff]/.test(token.key)) {
        return token.key.length >= 3 && !zhNoteStopWords.has(token.key) && !zhReferenceWords.includes(token.key);
      }
      return token.key.length >= 4 && !stopWordSet.has(token.key);
    }

    function isStrongKeywordCandidate(item) {
      const isChinese = /[\u3400-\u9fff]/.test(item.text);
      const isProperName = /\b[A-Z][A-Za-z0-9-]{2,}\b/.test(item.text) && !/^[A-Z]{1,2}$/.test(item.text);
      if (isChinese) {
        return item.count >= 2 && item.text.length >= 3;
      }
      return item.count >= 2 || isProperName;
    }

    function isChineseConceptKey(key) {
      if (!key || /^[0-9]+$/.test(key)) return false;
      if (/[\u3400-\u9fff]/.test(key)) {
        return key.length >= 2 && !zhNoteStopWords.has(key) && !zhReferenceWords.includes(key);
      }
      return key.length >= 4 && !stopWords.has(key);
    }

    function extractKeywords(text, limit = 3) {
      const stopWordSet = noteStopWordsForText(text);
      const items = noteTokens(text).filter(item => isUsefulNoteToken(item, stopWordSet));
      const counts = new Map();

      for (const item of items) {
        const entry = counts.get(item.key) || { text: item.text, count: 0, first: item.index };
        entry.count += 1;
        entry.first = Math.min(entry.first, item.index);
        if (item.text.length > entry.text.length) entry.text = item.text;
        counts.set(item.key, entry);
      }

      const textLength = Math.max(text.length, 1);
      return Array.from(counts.values())
        .filter(isStrongKeywordCandidate)
        .map(item => ({
          ...item,
          score: item.count * 3 + (1 - item.first / textLength)
        }))
        .sort((a, b) => b.score - a.score || a.first - b.first)
        .slice(0, limit)
        .map(item => item.text);
    }

    function sentenceScore(sentence, keywordSet, position, total, stopWordSet) {
      const tokensInSentence = noteTokens(sentence.text).filter(item => isUsefulNoteToken(item, stopWordSet));
      const unique = new Set(tokensInSentence.map(token => token.key));
      const keywordHits = Array.from(unique).filter(key => keywordSet.has(key)).length;
      const connectorBoost = connectorGroups.concat(zhConnectorGroups)
        .some(group => group.words.some(word => sentence.text.toLowerCase().includes(word))) ? 1.2 : 0;
      const lengthPenalty = sentence.text.length > 240 ? -1.5 : sentence.text.length < 24 ? -1 : 0;
      const earlyBoost = position < Math.max(2, total * 0.2) ? 0.8 : 0;
      return keywordHits * 2 + connectorBoost + earlyBoost + lengthPenalty;
    }

    function extractKeySentences(text, keywords, limit = 2) {
      const sentences = readingUnits(text);
      const keywordSet = new Set(keywords.map(keyword => /[\u3400-\u9fff]/.test(keyword) ? keyword : lowerToken(keyword)));
      const stopWordSet = noteStopWordsForText(text);
      return sentences
        .map((sentence, index) => ({
          text: sentence.text.trim(),
          index,
          score: sentenceScore(sentence, keywordSet, index, sentences.length, stopWordSet)
        }))
        .filter(item => item.text.length >= 12)
        .sort((a, b) => b.score - a.score || a.index - b.index)
        .slice(0, limit)
        .sort((a, b) => a.index - b.index)
        .map(item => item.text);
    }

    function buildNotesDraft(text) {
      const keywords = extractKeywords(text);
      const keySentences = extractKeySentences(text, keywords);
      return { keywords, keySentences, marked: markedSentences.map(sentence => sentence.text) };
    }

    function tokenIndexForKeyword(keyword) {
      const normalized = lowerToken(keyword);
      return tokens.findIndex(token => {
        const tokenKey = lowerToken(token.text);
        return tokenKey === normalized || (/[\u3400-\u9fff]/.test(keyword) && token.text.includes(keyword));
      });
    }

    function tokenIndexForSentenceText(sentenceText) {
      const target = sentenceText.trim().replace(/\s+/g, " ");
      const sentence = readingUnits(sourceText.value).find(item => item.text.trim().replace(/\s+/g, " ") === target);
      return sentence ? tokenIndexForChar(sentence.start) : -1;
    }

    function noteLinkHTML(label, index) {
      if (index < 0) return escapeHTML(label);
      return `<button class="note-link" type="button" data-note-target="${index}">${escapeHTML(label)}</button>`;
    }

    function renderNotes() {
      const text = sourceText.value.trim();
      if (!text) {
        notesOutput.innerHTML = `<div class="note-card">${escapeHTML(t("pasteFirst"))}</div>`;
        return;
      }

      const { keywords, keySentences, marked } = buildNotesDraft(text);
      const markedEntries = markedSentences.map(sentence => ({
        text: sentence.text,
        index: tokenIndexForChar(sentence.start)
      }));
      const keywordEntries = keywords.map(keyword => ({
        text: keyword,
        index: tokenIndexForKeyword(keyword)
      }));
      const keySentenceEntries = keySentences.map(sentence => ({
        text: sentence,
        index: tokenIndexForSentenceText(sentence)
      }));
      const meta = t("noteMeta", {
        chars: text.length.toLocaleString(),
        words: roughWordCount(text).toLocaleString()
      });
      notesOutput.innerHTML = `
        <section class="note-card">
          <h2>${escapeHTML(t("markedTitle"))}</h2>
          <ol class="key-sentence-list">
            ${markedEntries.map(entry => `<li>${noteLinkHTML(entry.text, entry.index)}</li>`).join("") || `<li>${escapeHTML(t("none"))}</li>`}
          </ol>
          <div class="note-meta">${escapeHTML(t("notesDisclaimer"))}</div>
        </section>
        <section class="note-card">
          <h2>${escapeHTML(t("keywordsTitle"))}</h2>
          <ul class="keyword-list">
            ${keywordEntries.map(entry => `<li>${noteLinkHTML(entry.text, entry.index)}</li>`).join("") || `<li>${escapeHTML(t("noKeywords"))}</li>`}
          </ul>
          <div class="note-meta">${meta}</div>
        </section>
        <section class="note-card">
          <h2>${escapeHTML(t("keySentencesTitle"))}</h2>
          <ol class="key-sentence-list">
            ${keySentenceEntries.map(entry => `<li>${noteLinkHTML(entry.text, entry.index)}</li>`).join("") || `<li>${escapeHTML(t("none"))}</li>`}
          </ol>
          <div class="note-meta">${escapeHTML(t("notesDisclaimer"))}</div>
        </section>
        <div class="notes-footnote">${escapeHTML(t("noteReminder"))}</div>
      `;
    }

    function jumpToReviewTarget(index) {
      if (index < 0 || !tokens[index]) return;
      window.clearTimeout(reviewTargetTimer);
      reviewTargetIndex = index;
      render();
      const target = reader.querySelector(`[data-index="${index}"]`);
      target?.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      setStatus(t("reviewJumped"));
      reviewTargetTimer = window.setTimeout(() => {
        reviewTargetIndex = -1;
        render();
      }, 2200);
    }

    async function copyNotesDraft() {
      const text = sourceText.value.trim();
      if (!text) {
        setStatus(t("pasteFirst"));
        return;
      }

      const { keywords, keySentences, marked } = buildNotesDraft(text);
      const draft = [
        t("draftReminder"),
        `- ${t("noteReminder")}`,
        "",
        t("draftMarked"),
        marked.map(sentence => `- ${sentence}`).join("\n") || `- ${t("none")}`,
        "",
        t("draftKeywords"),
        keywords.map(keyword => `- ${keyword}`).join("\n") || `- ${t("none")}`,
        "",
        t("draftKeySentences"),
        keySentences.map(sentence => `- ${sentence}`).join("\n") || `- ${t("none")}`
      ].join("\n");

      try {
        await navigator.clipboard.writeText(draft);
        setStatus(t("notesCopied"));
      } catch {
        setStatus(t("copyFailed"));
      }
    }

    function isTokenInMarkedSentence(token) {
      return markedSentences.some(sentence => token.start >= sentence.start && token.end <= sentence.end);
    }

    function isSentenceMarked(sentence) {
      const text = sentence.text.trim().replace(/\s+/g, " ");
      return markedSentences.some(item => item.start === sentence.start && item.end === sentence.end && item.text === text);
    }

    function markCurrentSentence() {
      const sentence = sentenceRangeForToken(activeIndex);
      if (!sentence) {
        setStatus(t("noSentenceToMark"));
        return;
      }

      const text = sentence.text.trim().replace(/\s+/g, " ");
      if (isSentenceMarked(sentence)) {
        markedSentences = markedSentences.filter(item => !(item.start === sentence.start && item.end === sentence.end && item.text === text));
        render();
        if (notesPanel.open) renderNotes();
        setStatus(t("sentenceUnmarked"));
        return;
      }

      markedSentences.push({ start: sentence.start, end: sentence.end, text });
      render();
      if (notesPanel.open) renderNotes();
      setStatus(t("sentenceMarked"));
    }

    function goToPreviousSentence() {
      const targetIndex = previousSentenceTokenIndex();
      if (targetIndex < 0) {
        setStatus(t("noPreviousSentence"));
        return;
      }

      if (isReading && !isPaused) {
        startFromToken(targetIndex);
        return;
      }

      if (isReading && isPaused) playbackRunId += 1;
      clearSilentTimer();
      if (voiceEnabled) window.speechSynthesis.cancel();
      utterance = null;
      activeIndex = targetIndex;
      render();
      updatePlaybackButtons();
      setStatus(t("previousSentenceReady"));
    }

    function goToNextSentence() {
      const targetIndex = nextSentenceTokenIndex();
      if (targetIndex < 0) {
        setStatus(t("noNextSentence"));
        return;
      }

      if (isReading && !isPaused) {
        startFromToken(targetIndex);
        return;
      }
      if (isReading && isPaused) playbackRunId += 1;
      clearSilentTimer();
      if (voiceEnabled) window.speechSynthesis.cancel();
      utterance = null;
      activeIndex = targetIndex;
      render();
      updatePlaybackButtons();
      setStatus(t("nextSentenceReady"));
    }

    function goToPreviousParagraph() {
      const targetIndex = previousParagraphTokenIndex();
      if (targetIndex < 0) {
        setStatus(t("noPreviousParagraph"));
        return;
      }

      if (isReading && !isPaused) {
        startFromToken(targetIndex);
        return;
      }

      if (isReading && isPaused) playbackRunId += 1;
      clearSilentTimer();
      if (voiceEnabled) window.speechSynthesis.cancel();
      utterance = null;
      activeIndex = targetIndex;
      render();
      updatePlaybackButtons();
      setStatus(t("previousParagraphReady"));
    }

    function goToNextParagraph() {
      const targetIndex = nextParagraphTokenIndex();
      if (targetIndex < 0) {
        setStatus(t("noNextParagraph"));
        return;
      }

      if (isReading && !isPaused) {
        startFromToken(targetIndex);
        return;
      }

      if (isReading && isPaused) playbackRunId += 1;
      clearSilentTimer();
      if (voiceEnabled) window.speechSynthesis.cancel();
      utterance = null;
      activeIndex = targetIndex;
      render();
      updatePlaybackButtons();
      setStatus(t("nextParagraphReady"));
    }

    function annotateInformationFlow(sourceTokens, source) {
      if (annotationIntensity === "off") return sourceTokens;
      const annotated = sourceTokens.map(token => ({ ...token, flow: "" }));
      const seenTerms = new Map();

      for (const token of annotated) {
        const key = lowerToken(token.text);
        if (!key || key.length < 3 || stopWords.has(key)) continue;
        seenTerms.set(key, (seenTerms.get(key) ?? 0) + 1);
      }

      const alreadySeen = new Set();
      const sentences = splitSentences(source);

      for (const sentence of sentences) {
        const indices = annotated
          .map((token, index) => ({ token, index }))
          .filter(item => item.token.start >= sentence.start && item.token.end <= sentence.end)
          .map(item => item.index);

        if (!indices.length) continue;

        const label = connectorLabelForSentence(sentence.text);
        if (label) annotated[indices[0]].sentenceLabel = label;

        for (const index of indices) {
          const token = annotated[index];
          const key = lowerToken(token.text);
          if (!key) continue;

          const isConnector = connectorGroups.some(group => group.words.includes(key));
          if (isConnector) {
            token.flow = "link";
          } else if (key.length >= 3 && seenTerms.get(key) > 1 && alreadySeen.has(key)) {
            token.flow = "old";
          }

          if (key.length >= 3 && !stopWords.has(key)) {
            alreadySeen.add(key);
          }
        }

        const contentIndices = indices.filter(index => {
          const key = lowerToken(annotated[index].text);
          return key.length >= 4 && !stopWords.has(key) && annotated[index].flow !== "link";
        });

        const hasSignal = indices.some(index => annotated[index].flow === "link" || annotated[index].flow === "old");
        if (annotationIntensity === "light" && !hasSignal) continue;
        if (!hasSignal && contentIndices.length < 8) continue;

        const newLimit = annotationIntensity === "standard" ? 2 : 1;
        for (const index of contentIndices.slice(-newLimit)) {
          if (!annotated[index].flow) annotated[index].flow = "new";
        }
      }

      return annotated;
    }

    function annotateChineseFlow(sourceTokens, source) {
      if (annotationIntensity === "off") return sourceTokens;
      const annotated = sourceTokens.map(token => ({ ...token, flow: "" }));
      const sentences = splitSentences(source);
      const conceptCounts = new Map();
      const seenConcepts = new Set();

      for (const token of annotated) {
        const key = /[\u3400-\u9fff]/.test(token.text) ? token.text.trim() : lowerToken(token.text);
        if (!isChineseConceptKey(key)) continue;
        conceptCounts.set(key, (conceptCounts.get(key) ?? 0) + 1);
      }

      for (const sentence of sentences) {
        const indices = annotated
          .map((token, index) => ({ token, index }))
          .filter(item => item.token.start >= sentence.start && item.token.end <= sentence.end)
          .map(item => item.index);

        if (!indices.length) continue;

        const label = zhConnectorLabelForSentence(sentence.text);
        if (label) annotated[indices[0]].sentenceLabel = label;

        let repeatedConceptsInSentence = 0;
        const conceptLimit = annotationIntensity === "standard" ? 2 : 1;

        for (const index of indices) {
          const tokenText = annotated[index].text;
          const inConnector = zhConnectorGroups.some(group => group.words.some(word => tokenText.includes(word) || sentence.text.slice(annotated[index].start - sentence.start).startsWith(word)));
          const isReference = zhReferenceWords.some(word => tokenText === word || tokenText.includes(word));

          if (inConnector) {
            annotated[index].flow = "link";
          } else if (isReference) {
            annotated[index].flow = "old";
          }

          const key = /[\u3400-\u9fff]/.test(tokenText) ? tokenText.trim() : lowerToken(tokenText);
          if (isChineseConceptKey(key) && conceptCounts.get(key) > 1) {
            if (seenConcepts.has(key) && !annotated[index].flow && repeatedConceptsInSentence < conceptLimit) {
              annotated[index].flow = "new";
              repeatedConceptsInSentence += 1;
            }
            seenConcepts.add(key);
          }
        }
      }

      return annotated;
    }

    function annotateFlow(sourceTokens, source, mode) {
      if (mode === "off") return sourceTokens;
      if (mode === "zh") return annotateChineseFlow(sourceTokens, source);
      return annotateInformationFlow(sourceTokens, source);
    }

    function bionicHTML(word) {
      const chars = Array.from(word);
      if (!chars.length) return "";
      const prefixLength = Math.min(chars.length, Math.max(1, Math.ceil(chars.length * 0.45)));
      const prefix = escapeHTML(chars.slice(0, prefixLength).join(""));
      const suffix = escapeHTML(chars.slice(prefixLength).join(""));
      return `<strong>${prefix}</strong>${suffix}`;
    }

    function shouldUseBionic(word) {
      if (!/\p{Script=Latin}/u.test(word) || /[\u3400-\u9fff]/.test(word)) return false;
      if (bionicMode === "off") return false;
      const latinWord = word.match(/[\p{Script=Latin}][\p{Script=Latin}\p{N}'’\u2011-]*/u)?.[0] || "";
      return Array.from(latinWord).length >= 4;
    }

    function tokenHTML(word) {
      return shouldUseBionic(word) ? bionicHTML(word) : escapeHTML(word);
    }

    function escapeHTML(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render() {
      if (!tokens.length) {
        renderEmptyState();
        gentleGuide.classList.remove("visible");
        updateProgress();
        updateMarkButton();
        updatePreviousButton();
        updateNextButton();
        updateParagraphButtons();
        return;
      }

      readerPanel.classList.remove("is-empty");
      const source = sourceText.value.trim();
      const currentFlowMode = effectiveFlowMode(source);
      const displayTokens = annotateFlow(tokens, source, currentFlowMode);
      const sentenceFocus = sentenceRangeForToken(activeIndex);
      const activeParagraphIndex = paragraphIndexForToken(activeIndex);
      const renderTokenRange = (rangeStart, rangeEnd) => {
        let cursor = rangeStart;
        const rangeTokens = displayTokens.filter(token => token.start >= rangeStart && token.end <= rangeEnd);
        return rangeTokens.map(token => {
          const index = displayTokens.indexOf(token);
          const active = index === activeIndex ? " active" : "";
          const reviewTarget = index === reviewTargetIndex ? " review-target" : "";
          const flowClass = currentFlowMode !== "off" && token.flow ? ` flow-${token.flow}` : "";
          const sentenceClass = gentleMode && sentenceFocus && token.start >= sentenceFocus.start && token.end <= sentenceFocus.end ? " sentence-focus" : "";
          const markedClass = isTokenInMarkedSentence(token) ? " marked-sentence" : "";
          const gentleReadClass = gentleMode && activeIndex >= 0 && index < activeIndex ? " gentle-read" : "";
          const gentleOutsideClass = gentleMode && sentenceFocus && (token.start < sentenceFocus.start || token.end > sentenceFocus.end) ? " gentle-outside" : "";
          const label = currentFlowMode !== "off" && token.sentenceLabel ? `<span class="flow-label">${token.sentenceLabel}</span>` : "";
          const spacer = escapeHTML(source.slice(cursor, token.start));
          cursor = token.end;
          return `${spacer}${label}<span class="token${active}${reviewTarget}${flowClass}${sentenceClass}${markedClass}${gentleReadClass}${gentleOutsideClass}" data-index="${index}">${tokenHTML(token.text)}</span>`;
        }).join("") + escapeHTML(source.slice(cursor, rangeEnd));
      };

      const renderTableBlock = block => `
        <div class="table-wrap">
          <table class="reader-table">
            <tbody>
              ${block.rows.map(row => {
                const rowActive = activeIndex >= 0 && tokens[activeIndex]?.start >= row.start && tokens[activeIndex]?.start < row.end;
                const rowClass = rowActive ? " table-row-current" : gentleMode ? " table-row-away" : "";
                return `<tr class="${rowClass.trim()}">${row.cells.map(cell => {
                  const tag = cell.header ? "th" : "td";
                  return `<${tag}>${renderTokenRange(cell.start, cell.end)}</${tag}>`;
                }).join("")}</tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;

      const legend = currentFlowMode === "off" || annotationIntensity === "off" ? "" : (
        currentFlowMode === "zh"
          ? `<div class="legend">
              <span class="legend-item"><span class="swatch link">线</span>${escapeHTML(currentCopyGroup("zhLegend").link)}</span>
              <span class="legend-item"><span class="swatch old">底</span>${escapeHTML(currentCopyGroup("zhLegend").old)}</span>
              <span class="legend-item"><span class="swatch new">点</span>${escapeHTML(currentCopyGroup("zhLegend").new)}</span>
            </div>`
          : `<div class="legend">
              <span class="legend-item"><span class="swatch link">line</span>${escapeHTML(currentCopyGroup("enLegend").link)}</span>
              <span class="legend-item"><span class="swatch old">old</span>${escapeHTML(currentCopyGroup("enLegend").old)}</span>
              <span class="legend-item"><span class="swatch new">new</span>${escapeHTML(currentCopyGroup("enLegend").new)}</span>
            </div>`
      );

      let paragraphs;
      if (!tableBlocks.length) {
        paragraphs = renderTokenRange(0, source.length)
          .split(/\n{2,}/)
          .map((block, index) => {
            const gentleClass = gentleMode && activeParagraphIndex >= 0
              ? (index === activeParagraphIndex ? " gentle-current" : " gentle-away")
              : "";
            return `<p class="paragraph${gentleClass}">${block}</p>`;
          })
          .join("");
      } else {
        const normalRange = (start, end) => renderTokenRange(start, end)
          .split(/\n{2,}/)
          .filter(block => block.trim())
          .map(block => `<p class="paragraph">${block}</p>`)
          .join("");
        const blocks = [];
        let cursor = 0;
        for (const block of tableBlocks) {
          blocks.push(normalRange(cursor, block.start));
          blocks.push(renderTableBlock(block));
          cursor = block.end;
        }
        blocks.push(normalRange(cursor, source.length));
        paragraphs = blocks.join("");
      }

      reader.innerHTML = legend + paragraphs;
      updateGentleGuide(sentenceFocus);

      const active = reader.querySelector(".token.active");
      if (active) {
        active.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      }

      updateProgress();
      updateMarkButton();
      updatePreviousButton();
      updateNextButton();
      updateParagraphButtons();
    }

    function updateGentleGuide(sentenceFocus) {
      if (!gentleMode || !sentenceAnchorEnabled || !sentenceFocus || activeIndex < 0) {
        gentleGuide.classList.remove("visible");
        return;
      }

      const currentSentenceIndex = sentenceIndexForToken(activeIndex);
      const sentenceCount = readingUnits(sourceText.value).length;
      const sentenceText = sentenceFocus.text.trim().replace(/\s+/g, " ");
      const unitLabel = sentenceFocus.kind === "table-row" ? "currentRow" : "currentSentence";
      gentleGuideContent.innerHTML = `
        <strong>${escapeHTML(t(unitLabel, { current: currentSentenceIndex + 1, total: sentenceCount }))}</strong><br>
        ${escapeHTML(sentenceText)}
      `;
      gentleGuide.classList.add("visible");
    }

    function updateProgress() {
      if (!tokens.length || activeIndex < 0) {
        progressPill.classList.remove("visible");
        return;
      }

      const unit = readingUnitForToken(activeIndex);
      if (unit?.kind === "table-row") {
        const table = tableBlocks.find(block => block.start === unit.tableStart && block.end === unit.tableEnd);
        progressPill.textContent = t("rowProgress", {
          current: unit.rowIndex + 1,
          total: table?.rows.length || unit.rowIndex + 1
        });
        progressPill.classList.add("visible");
        return;
      }

      const ranges = paragraphRanges(sourceText.value);
      const paragraphIndex = paragraphIndexForToken(activeIndex);
      if (paragraphIndex < 0) {
        progressPill.classList.remove("visible");
        return;
      }

      progressPill.textContent = t("progress", { current: paragraphIndex + 1, total: ranges.length });
      progressPill.classList.add("visible");
    }

    function rebuildTokens() {
      tokens = tokenize(sourceText.value);
      activeIndex = -1;
      hasCompleted = false;
      reviewTargetIndex = -1;
      window.clearTimeout(reviewTargetTimer);
      markedSentences = [];
      updateTextMeter();
      updateNavigationButtons();
      render();
      updatePlaybackButtons();
      if (notesPanel.open) renderNotes();
      if (tokens.length) {
        setStatus(t("loaded", {
          tokens: tokens.length.toLocaleString(),
          chars: sourceText.value.length.toLocaleString()
        }));
      } else {
        setStatus(t("noText"));
      }
    }

    function tokenIndexForChar(charIndex) {
      if (!tokens.length) return -1;
      const found = tokens.findIndex(token => charIndex >= token.start && charIndex < token.end);
      if (found >= 0) return found;
      let nearest = 0;
      for (let index = 0; index < tokens.length; index += 1) {
        if (tokens[index].start <= charIndex) nearest = index;
      }
      return nearest;
    }

    function clearSilentTimer() {
      if (silentTimer) {
        window.clearTimeout(silentTimer);
        silentTimer = null;
      }
    }

    function clearBoundaryTimer() {
      boundaryTimers.forEach(timer => window.clearTimeout(timer));
      boundaryTimers.clear();
    }

    function finishReading(runId) {
      if (runId !== playbackRunId) return;
      clearSilentTimer();
      clearBoundaryTimer();
      utterance = null;
      speechChunks = [];
      speechChunkIndex = -1;
      isReading = false;
      isPaused = false;
      hasCompleted = true;
      activeIndex = -1;
      hideComfortNote();
      render();
      updateProgress();
      updatePlaybackButtons();
      setStatus(t("finished"));
    }

    function tokenDurationMs(token) {
      const rate = Math.max(0.1, Number(rateInput.value) || 1);
      const text = token?.text ?? "";
      let base = 300;
      if (/[。！？.!?]/.test(text)) {
        base = 520;
      } else if (/[，,、；;：:]/.test(text)) {
        base = 340;
      } else if (/[\u3400-\u9fff]/.test(text)) {
        base = 360;
      } else {
        base = Math.min(650, Math.max(230, 170 + text.length * 34));
      }
      return Math.max(90, base / rate);
    }

    function scheduleSilentAdvance(runId) {
      clearSilentTimer();
      if (runId !== playbackRunId || !isReading || isPaused) return;
      if (activeIndex >= tokens.length - 1) {
        silentTimer = window.setTimeout(() => finishReading(runId), tokenDurationMs(tokens[activeIndex]));
        return;
      }

      silentTimer = window.setTimeout(() => {
        if (runId !== playbackRunId || !isReading || isPaused) return;
        activeIndex += 1;
        render();
        setStatus(t("reading", { token: tokens[activeIndex]?.text ?? "" }));
        scheduleSilentAdvance(runId);
      }, tokenDurationMs(tokens[activeIndex]));
    }

    function stopReading({ browse = true } = {}) {
      playbackRunId += 1;
      clearSilentTimer();
      clearBoundaryTimer();
      window.speechSynthesis.cancel();
      utterance = null;
      speechChunks = [];
      speechChunkIndex = -1;
      isReading = false;
      isPaused = false;
      hasCompleted = tokens.length > 0;
      activeIndex = -1;
      reviewTargetIndex = -1;
      window.clearTimeout(reviewTargetTimer);
      hideComfortNote();
      setBrowseMode(browse && tokens.length > 0);
      render();
      updateProgress();
      updatePlaybackButtons();
      setStatus(t("stopped"));
    }

    function speakSpeechChunk(runId, startIndex) {
      if (runId !== playbackRunId || !isReading || isPaused) return;

      const chunk = speechChunks[speechChunkIndex];
      if (!chunk) {
        finishReading(runId);
        return;
      }

      const token = tokens[startIndex];
      const chunkStart = token && token.start < chunk.end ? token.start : chunk.start;
      const rawText = sourceText.value.trim().slice(chunkStart, chunk.end);
      const leadingWhitespace = rawText.search(/\S|$/);
      const text = normalizeForSpeech(rawText);
      if (!text) {
        speechChunkIndex += 1;
        speakSpeechChunk(runId, firstTokenAtOrAfter(speechChunks[speechChunkIndex]?.start ?? chunk.end));
        return;
      }

      if (!/[\p{L}\p{N}]/u.test(text)) {
        speechChunkIndex += 1;
        speakSpeechChunk(runId, firstTokenAtOrAfter(speechChunks[speechChunkIndex]?.start ?? chunk.end));
        return;
      }

      speechOffset = chunkStart + Math.max(0, leadingWhitespace);
      utterance = new SpeechSynthesisUtterance(text);
      const voice = speechVoiceForText(text, sourceText.value);
      utterance.lang = voice?.lang || speechLocaleForLanguage(speechLanguageForText(text, sourceText.value));
      if (voice) utterance.voice = voice;
      utterance.rate = Number(rateInput.value);
      utterance.pitch = 1;
      utterance.volume = 1;

      utterance.onboundary = event => {
        if (runId !== playbackRunId || event.charIndex == null) return;
        const nextIndex = tokenIndexForChar(speechOffset + event.charIndex);
        const timer = window.setTimeout(() => {
          boundaryTimers.delete(timer);
          if (runId !== playbackRunId || !isReading || isPaused) return;
          if (nextIndex === activeIndex) return;
          activeIndex = nextIndex;
          render();
          setStatus(t("reading", { token: tokens[activeIndex]?.text ?? "" }));
        }, speechHighlightDelayMs);
        boundaryTimers.add(timer);
      };

      utterance.onend = () => {
        if (runId !== playbackRunId) return;
        speechChunkIndex += 1;
        if (speechChunkIndex >= speechChunks.length) {
          finishReading(runId);
          return;
        }

        const nextIndex = firstTokenAtOrAfter(speechChunks[speechChunkIndex].start);
        if (nextIndex < 0) {
          finishReading(runId);
          return;
        }
        activeIndex = nextIndex;
        render();
        speakSpeechChunk(runId, nextIndex);
      };

      utterance.onerror = () => {
        if (runId !== playbackRunId) return;
        const elapsed = ((Date.now() - playStartedAt) / 1000).toFixed(1);
        clearBoundaryTimer();
        speechChunks = [];
        speechChunkIndex = -1;
        isReading = false;
        isPaused = false;
        activeIndex = -1;
        render();
        updateProgress();
        updatePlaybackButtons();
        setStatus(t("interrupted", { seconds: elapsed }));
      };

      window.speechSynthesis.speak(utterance);
    }

    function speakFromToken(startIndex) {
      if (!tokens.length) return;
      const safeStartIndex = Math.max(0, Math.min(startIndex, tokens.length - 1));
      const source = sourceText.value.trim();
      const runId = ++playbackRunId;

      speechChunks = speechChunksForText(source);
      speechChunkIndex = speechChunkIndexForToken(safeStartIndex);
      clearSilentTimer();
      clearBoundaryTimer();
      window.speechSynthesis.cancel();
      reviewTargetIndex = -1;
      window.clearTimeout(reviewTargetTimer);
      activeIndex = safeStartIndex;
      isReading = true;
      isPaused = false;
      setBrowseMode(false);
      render();
      updatePlaybackButtons();

      playStartedAt = Date.now();
      setStatus(t("started", { rate: Number(rateInput.value).toFixed(2) }));
      if (gentleMode) showComfortNote();
      speakSpeechChunk(runId, safeStartIndex);
    }

    function readSilentlyFromToken(startIndex) {
      if (!tokens.length) return;
      const safeStartIndex = Math.max(0, Math.min(startIndex, tokens.length - 1));
      const runId = ++playbackRunId;

      clearSilentTimer();
      clearBoundaryTimer();
      window.speechSynthesis.cancel();
      reviewTargetIndex = -1;
      window.clearTimeout(reviewTargetTimer);
      utterance = null;
      activeIndex = safeStartIndex;
      isReading = true;
      isPaused = false;
      playStartedAt = Date.now();
      setBrowseMode(false);
      render();
      updatePlaybackButtons();
      setStatus(t("started", { rate: Number(rateInput.value).toFixed(2) }));
      if (gentleMode) showComfortNote();
      scheduleSilentAdvance(runId);
    }

    function startFromToken(startIndex) {
      if (voiceEnabled) {
        speakFromToken(startIndex);
      } else {
        readSilentlyFromToken(startIndex);
      }
    }

    function restartAtCurrentWord() {
      if (!isReading || !tokens.length) return;
      const resumeIndex = activeIndex >= 0 ? activeIndex : 0;
      startFromToken(resumeIndex);
      setStatus(t("rateChangedNow", { rate: Number(rateInput.value).toFixed(2) }));
    }

    function play() {
      const text = normalizeForSpeech(sourceText.value);
      if (!text) {
        setStatus(t("pasteFirst"));
        sourceText.focus();
        return;
      }

      tokens = tokenize(sourceText.value);
      setBrowseMode(false);
      startFromToken(0);
    }

    async function readClipboard() {
      try {
        setBrowseMode(false);
        if (navigator.clipboard?.read) {
          try {
            const clipboardItems = await navigator.clipboard.read();
            for (const item of clipboardItems) {
              if (!item.types.includes("text/html")) continue;
              const html = await (await item.getType("text/html")).text();
              const content = parseClipboardContent(html);
              if (content) {
                loadClipboardContent(content);
                return;
              }
            }
          } catch {
            // Fall back to plain text when rich clipboard access is unavailable.
          }
        }
        const text = await navigator.clipboard.readText();
        if (!text.trim()) {
          setStatus(t("clipboardEmpty"));
          return;
        }
        if (text.trim() === sourceText.value.trim()) {
          setStatus(t("clipboardUnchanged"));
          return;
        }
        sourceText.value = text;
        tableBlocks = [];
        rebuildTokens();
        setStatus(t("clipboardLoaded"));
        openGuidePrompt();
      } catch {
        setBrowseMode(false);
        setStatus(t("clipboardFailed"));
        sourceText.focus();
      }
    }

    function handleSourcePaste(event) {
      const clipboardHTML = event.clipboardData?.getData("text/html");
      const content = parseClipboardContent(clipboardHTML);
      const hasSelection = sourceText.selectionStart === 0 && sourceText.selectionEnd === sourceText.value.length;
      if (!content || (sourceText.value.trim() && !hasSelection)) {
        window.setTimeout(openGuidePrompt, 0);
        return;
      }

      event.preventDefault();
      loadClipboardContent(content);
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
    }

    function startNewText() {
      stopReading({ browse: false });
      sourceText.value = "";
      tableBlocks = [];
      rebuildTokens();
      setBrowseMode(false);
      scrollToTop();
      sourceText.focus();
      setStatus(t("newTextReady"));
    }

    function acceptExternalText(text) {
      const cleanText = String(text || "").trim();
      if (!cleanText) return;
      stopReading({ browse: false });
      setBrowseMode(false);
      sourceText.value = cleanText;
      tableBlocks = [];
      rebuildTokens();
      setStatus(t("externalLoaded"));
      sourceText.focus();
      openGuidePrompt();
    }

    function loadSampleText() {
      stopReading({ browse: false });
      setBrowseMode(false);
      sourceText.value = t("sampleText");
      tableBlocks = [];
      rebuildTokens();
      setStatus(t("sampleLoaded"));
      sourceText.focus();
      openGuidePrompt();
    }

    function readTextFromURL() {
      const queryText = new URLSearchParams(window.location.search).get("text");
      const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
      const hashText = new URLSearchParams(hash).get("text");
      return queryText || hashText || "";
    }

    function setupExternalTextEntry() {
      const textFromURL = readTextFromURL();
      if (textFromURL) {
        acceptExternalText(textFromURL);
        window.history.replaceState(null, "", window.location.pathname);
      }

      window.addEventListener("message", event => {
        const data = event.data;
        if (!data || data.type !== "bandu-reader-text") return;
        acceptExternalText(data.text);
      });
    }

    function loadReadingPreferences() {
      try {
        const saved = JSON.parse(localStorage.getItem(preferenceKey) || "{}");
        if (saved.rate) rateInput.value = saved.rate;
        if (saved.font) fontInput.value = saved.font;
        if (saved.line) lineInput.value = saved.line;
        if (saved.width) widthInput.value = saved.width;
        if (saved.theme && themes.includes(saved.theme)) currentTheme = saved.theme;
        if (saved.flowMode && flowModes.includes(saved.flowMode)) flowMode = saved.flowMode;
        if (saved.bionicMode && bionicModes.includes(saved.bionicMode)) bionicMode = saved.bionicMode;
        if (saved.highlightPalette && highlightPalettes.includes(saved.highlightPalette)) highlightPalette = saved.highlightPalette;
        sentenceAnchorEnabled = saved.sentenceAnchor === true;
      } catch {
      }
    }

    function saveReadingPreferences() {
      try {
        localStorage.setItem(preferenceKey, JSON.stringify({
          rate: rateInput.value,
          font: fontInput.value,
          line: lineInput.value,
          width: widthInput.value,
          theme: currentTheme,
          flowMode,
          bionicMode,
          highlightPalette,
          sentenceAnchor: sentenceAnchorEnabled
        }));
      } catch {
      }
    }

    function updateSettings({ save = true } = {}) {
      document.documentElement.style.setProperty("--font-size", `${fontInput.value}px`);
      document.documentElement.style.setProperty("--line-height", lineInput.value);
      document.documentElement.style.setProperty("--max-width", `${widthInput.value}px`);
      rateValue.textContent = `${Number(rateInput.value).toFixed(2)}x`;
      fontValue.textContent = `${fontInput.value}px`;
      lineValue.textContent = Number(lineInput.value).toFixed(2);
      widthValue.textContent = `${widthInput.value}px`;
      if (save) saveReadingPreferences();
    }

    function applyTheme({ applyPreset = true, save = true } = {}) {
      document.body.dataset.theme = currentTheme;
      applyHighlightPalette({ save: false });
      const preset = themePresets[currentTheme];
      if (applyPreset && preset) {
        fontInput.value = preset.font;
        lineInput.value = preset.line;
        widthInput.value = preset.width;
        updateSettings({ save });
      }
      themeButton.textContent = `${t("themePrefix")}：${currentCopyGroup("themeLabels")[currentTheme]}`;
      themeButton.title = t("cycleHint");
      if (save) saveReadingPreferences();
    }

    function applyHighlightPalette({ save = true } = {}) {
      const color = highlightColors[highlightPalette] || highlightColors.rose;
      document.body.style.setProperty("--highlight", color);
      const label = currentCopyGroup("highlightLabels")[highlightPalette];
      const separator = uiLanguage === "zh" ? "：" : ": ";
      highlightLabel.textContent = `${t("highlightPrefix")}${separator}${label}`;
      highlightButton.title = t("cycleHint");
      highlightButton.setAttribute("aria-label", `${t("highlightPrefix")}${separator}${label}`);
      if (save) saveReadingPreferences();
    }

    function updateModeButtons() {
      flowButton.textContent = `${t("flowPrefix")}：${currentCopyGroup("flowLabels")[flowMode]}`;
      flowButton.title = t("cycleHint");
      flowButton.setAttribute("aria-pressed", String(flowMode !== "off"));
      bionicButton.textContent = `${t("bionicPrefix")}：${currentCopyGroup("bionicLabels")[bionicMode]}`;
      bionicButton.title = t("cycleHint");
      bionicButton.setAttribute("aria-pressed", String(bionicMode !== "off"));
      anchorButton.textContent = `${t("anchorPrefix")}：${currentCopyGroup("anchorLabels")[sentenceAnchorEnabled ? "on" : "off"]}`;
      anchorButton.title = t("cycleHint");
      anchorButton.disabled = !gentleMode;
      anchorButton.setAttribute("aria-pressed", String(sentenceAnchorEnabled));
      intensityButton.textContent = `${t("intensityPrefix")}：${currentCopyGroup("intensityLabels")[annotationIntensity]}`;
      intensityButton.title = t("cycleHint");
      intensityButton.hidden = flowMode === "off";
      gentleButton.textContent = gentleMode ? t("exitGentle") : t("gentle");
      gentleButton.title = t("gentleHint");
      gentleButton.setAttribute("aria-pressed", String(gentleMode));
    }

    function setFocusMode(value) {
      document.body.classList.toggle("focus-mode", value);
      updateModeButtons();
    }

    function randomComfortMessage() {
      const messages = currentCopyGroup("comfortMessages");
      return messages[Math.floor(Math.random() * messages.length)];
    }

    function showComfortNote(message = randomComfortMessage()) {
      window.clearTimeout(comfortTimer);
      comfortNote.textContent = message;
      comfortNote.classList.add("visible");
      comfortTimer = window.setTimeout(() => {
        comfortNote.classList.remove("visible");
      }, 5200);
    }

    function hideComfortNote() {
      window.clearTimeout(comfortTimer);
      comfortNote.classList.remove("visible");
    }

    function setGentleMode(value) {
      if (value && !gentleMode) {
        previousGentleSettings = {
          flowMode,
          bionicMode,
          annotationIntensity,
          currentTheme,
          rate: rateInput.value,
          font: fontInput.value,
          line: lineInput.value,
          width: widthInput.value
        };

        gentleMode = true;
        document.body.classList.add("gentle-mode");
        flowMode = "off";
        bionicMode = "off";
        annotationIntensity = "off";
        currentTheme = "open";
        setFocusMode(true);
        applyTheme({ save: false });
        fontInput.value = "42";
        lineInput.value = "2.05";
        widthInput.value = "780";
        updateSettings({ save: false });
        showComfortNote();
        setStatus(t("gentleOn"));
      } else if (!value && gentleMode) {
        gentleMode = false;
        document.body.classList.remove("gentle-mode");
        hideComfortNote();
        gentleGuide.classList.remove("visible");

        if (previousGentleSettings) {
          flowMode = previousGentleSettings.flowMode;
          bionicMode = previousGentleSettings.bionicMode;
          annotationIntensity = previousGentleSettings.annotationIntensity;
          currentTheme = previousGentleSettings.currentTheme;
          rateInput.value = previousGentleSettings.rate;
          fontInput.value = previousGentleSettings.font;
          lineInput.value = previousGentleSettings.line;
          widthInput.value = previousGentleSettings.width;
          setFocusMode(false);
          applyTheme({ applyPreset: false, save: false });
          updateSettings({ save: false });
        }

        setStatus(t("gentleOff"));
      }

      updateModeButtons();
      render();
    }

    function handleRateInput() {
      updateSettings();
      if (!isReading) return;
      if (isPaused) {
        setStatus(t("rateAfterResume", { rate: Number(rateInput.value).toFixed(2) }));
        return;
      }
      window.clearTimeout(rateRestartTimer);
      rateRestartTimer = window.setTimeout(restartAtCurrentWord, 180);
    }

    clipboardButton.addEventListener("click", readClipboard);
    topButton.addEventListener("click", scrollToTop);
    newTextButton.addEventListener("click", startNewText);
    reader.addEventListener("click", event => {
      if (event.target.closest("#sampleTextButton")) loadSampleText();
    });
    playButton.addEventListener("click", play);
    voiceButton.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      localStorage.setItem("slowglow-voice-enabled", String(voiceEnabled));
      updateVoiceButton();

      if (isReading && !isPaused) {
        restartAtCurrentWord();
      }
      setStatus(voiceEnabled ? t("voiceEnabled") : t("voiceMuted"));
    });
    menuButton.addEventListener("click", () => {
      if (document.body.classList.contains("browse-mode")) {
        setBrowseMode(false);
        menuCollapsed = false;
        updateMenuButton();
        return;
      }
      menuCollapsed = !menuCollapsed;
      updateMenuButton();
    });
    pauseButton.addEventListener("click", () => {
      if (isPaused) {
        restartAtCurrentWord();
      } else {
        if (voiceEnabled) {
          window.speechSynthesis.pause();
          clearBoundaryTimer();
        } else {
          clearSilentTimer();
        }
        isPaused = true;
        setStatus(t("paused"));
        updatePlaybackButtons();
      }
    });
    stopButton.addEventListener("click", stopReading);
    previousButton.addEventListener("click", goToPreviousSentence);
    nextButton.addEventListener("click", goToNextSentence);
    previousParagraphButton.addEventListener("click", goToPreviousParagraph);
    nextParagraphButton.addEventListener("click", goToNextParagraph);
    flowButton.addEventListener("click", () => {
      const nextIndex = (flowModes.indexOf(flowMode) + 1) % flowModes.length;
      flowMode = flowModes[nextIndex];
      saveReadingPreferences();
      updateModeButtons();
      render();
    });
    bionicButton.addEventListener("click", () => {
      const nextIndex = (bionicModes.indexOf(bionicMode) + 1) % bionicModes.length;
      bionicMode = bionicModes[nextIndex];
      saveReadingPreferences();
      updateModeButtons();
      render();
    });
    anchorButton.addEventListener("click", () => {
      sentenceAnchorEnabled = !sentenceAnchorEnabled;
      saveReadingPreferences();
      updateModeButtons();
      if (!sentenceAnchorEnabled) gentleGuide.classList.remove("visible");
      render();
    });
    intensityButton.addEventListener("click", () => {
      const nextIndex = (annotationIntensities.indexOf(annotationIntensity) + 1) % annotationIntensities.length;
      annotationIntensity = annotationIntensities[nextIndex];
      updateModeButtons();
      render();
    });
    gentleButton.addEventListener("click", () => setGentleMode(!gentleMode));
    languageButton.addEventListener("click", () => {
      uiLanguage = uiLanguage === "zh" ? "en" : "zh";
      localStorage.setItem("slowglow-ui-language", uiLanguage);
      applyLanguage({ resetStatus: true });
      render();
      if (notesPanel.open) renderNotes();
    });
    themeButton.addEventListener("click", () => {
      const nextIndex = (themes.indexOf(currentTheme) + 1) % themes.length;
      currentTheme = themes[nextIndex];
      applyTheme();
    });
    highlightButton.addEventListener("click", () => {
      const nextIndex = (highlightPalettes.indexOf(highlightPalette) + 1) % highlightPalettes.length;
      highlightPalette = highlightPalettes[nextIndex];
      applyHighlightPalette();
    });
    notesPanel.addEventListener("toggle", () => {
      if (notesPanel.open) renderNotes();
    });
    guidePromptAccept.addEventListener("click", () => closeGuidePrompt({ accept: true }));
    guidePromptDecline.addEventListener("click", () => closeGuidePrompt());
    guidePromptClose.addEventListener("click", () => closeGuidePrompt());
    guidePrompt.addEventListener("click", event => {
      if (event.target.matches("[data-guide-prompt-dismiss]")) closeGuidePrompt();
    });
    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && !guidePrompt.hidden) closeGuidePrompt();
    });
    notesOutput.addEventListener("click", event => {
      const link = event.target.closest("[data-note-target]");
      if (!link) return;
      jumpToReviewTarget(Number(link.dataset.noteTarget));
    });
    copyNotesButton.addEventListener("click", copyNotesDraft);
    markButton.addEventListener("click", markCurrentSentence);
    sourceText.addEventListener("input", () => {
      if (isReading) stopReading({ browse: false });
      tableBlocks = [];
      rebuildTokens();
    });
    sourceText.addEventListener("paste", handleSourcePaste);
    rateInput.addEventListener("input", handleRateInput);
    [fontInput, lineInput, widthInput].forEach(input => input.addEventListener("input", updateSettings));
    window.addEventListener("beforeunload", () => {
      clearSilentTimer();
      clearBoundaryTimer();
      window.clearTimeout(comfortTimer);
      window.speechSynthesis.cancel();
    });

    if ("speechSynthesis" in window) {
      refreshSpeechVoices();
      window.speechSynthesis.addEventListener?.("voiceschanged", refreshSpeechVoices);
    }

    loadReadingPreferences();
    updateSettings({ save: false });
    applyLanguage({ resetStatus: true });
    setupExternalTextEntry();

    if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
